services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    ports:
      - '8086:8086'
    environment:
      INFLUXDB_DB: smart_waste_telemetry
    volumes:
      - influx-data:/var/lib/influxdb

  # Single-node Kafka in KRaft mode (no ZooKeeper) — sufficient for
  # local development and CI. Topics are auto-created by the app;
  # a real cluster/topic provisioning is an ops concern out of scope
  # for this MVP.
  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - kafka-data:/bitnami/kafka

volumes:
  mongo-data:
  influx-data:
  kafka-data:
